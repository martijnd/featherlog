services:
  mysql:
    image: mysql:8.4
    container_name: featherlog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-featherlog}
      MYSQL_USER: ${MYSQL_USER:-featherlog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-featherlog}
    volumes:
      - mysql_data:/var/lib/mysql
    # No port mapping - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - featherlog-network

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: featherlog-server
    environment:
      PORT: ${PORT:-5000}
      MYSQL_URL: mysql://${MYSQL_USER:-featherlog}:${MYSQL_PASSWORD:-featherlog}@mysql:3306/${MYSQL_DATABASE:-featherlog}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - featherlog-network

volumes:
  mysql_data:

networks:
  featherlog-network:
    driver: bridge
