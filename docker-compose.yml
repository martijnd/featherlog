version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: featherlog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: featherlog
      MYSQL_USER: featherlog
      MYSQL_PASSWORD: featherlog
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: featherlog-server
    environment:
      PORT: 5000
      MYSQL_URL: mysql://featherlog:featherlog@mysql:3306/featherlog
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
